<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>ReadPilot</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      width: 340px;
      margin: 0;
      padding: 16px;
      color: #1f2328;
    }
    h1 { font-size: 16px; margin: 0 0 12px 0; }
    .section { margin-bottom: 14px; }
    .label { font-size: 12px; color: #656d76; margin-bottom: 4px; }
    .content {
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 240px;
      overflow-y: auto;
      padding: 10px;
      background: #f6f8fa;
      border-radius: 8px;
    }
    .empty { color: #656d76; font-style: italic; }
    a { color: #0969da; text-decoration: none; font-size: 13px; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>ReadPilot 最近解释</h1>

  <div class="section">
    <div class="label">选中文本</div>
    <div class="content" id="selectionText"><span class="empty">暂无</span></div>
  </div>

  <div class="section">
    <div class="label">解释结果</div>
    <div class="content" id="explanationText"><span class="empty">暂无</span></div>
  </div>

  <div class="section">
    <a href="#" id="settingsLink">设置 →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
