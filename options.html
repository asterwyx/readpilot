<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>ReadPilot 设置</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 560px;
      margin: 40px auto;
      padding: 0 20px;
      color: #1f2328;
    }
    h1 { font-size: 20px; margin-bottom: 24px; }
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .field textarea {
      min-height: 80px;
      resize: vertical;
      font-family: inherit;
    }
    .field .hint {
      font-size: 12px;
      color: #656d76;
      margin-top: 4px;
    }
    button {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      margin-right: 10px;
    }
    #saveBtn { background: #2da44e; color: #fff; }
    #saveBtn:hover { background: #218838; }
    #testBtn { background: #f6f8fa; border: 1px solid #d0d7de; color: #24292f; }
    #testBtn:hover { background: #eaeef2; }
    #status {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    .ok { background: #dafbe1; color: #1a7f37; display: block !important; }
    .err { background: #ffebe9; color: #cf222e; display: block !important; }
  </style>
</head>
<body>
  <h1>ReadPilot 设置</h1>

  <div class="field">
    <label for="provider">LLM 提供商</label>
    <select id="provider">
      <option value="openai">OpenAI 兼容</option>
      <option value="custom">自定义</option>
    </select>
    <div class="hint">OpenAI 兼容格式（Chat Completions）适用于 OpenAI、DeepSeek、Moonshot 等。</div>
  </div>

  <div class="field">
    <label for="endpoint">API Endpoint URL</label>
    <input id="endpoint" type="url" placeholder="https://api.openai.com/v1/chat/completions" />
    <div class="hint">需完整路径，例如 https://api.openai.com/v1/chat/completions</div>
  </div>

  <div class="field">
    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="sk-..." />
  </div>

  <div class="field">
    <label for="model">模型名称</label>
    <input id="model" type="text" placeholder="gpt-4o-mini" />
  </div>

  <div class="field">
    <label for="systemPrompt">System Prompt 覆盖（可选）</label>
    <textarea id="systemPrompt" placeholder="留空使用默认 prompt：结合网页上下文解释并补充相关知识"></textarea>
  </div>

  <button id="saveBtn">保存</button>
  <button id="testBtn">测试连接</button>

  <div id="status"></div>

  <script src="options.js" type="module"></script>
</body>
</html>
