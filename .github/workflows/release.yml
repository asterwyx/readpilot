# ReadPilot 发布工作流
# 触发条件：推送 v* 格式的 tag
# 流程：检出代码 → 校验版本号一致性 → 打包 CRX → 提取 CHANGELOG → 创建 Release
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码，保留完整历史以便提取 CHANGELOG
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 从 tag 名称提取版本号（去掉前缀 v）
      - name: 提取 tag 版本号
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 3. 读取 manifest.json 中的 version 字段
      - name: 读取 manifest 版本号
        id: manifest
        run: |
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          echo "version=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"

      # 4. 校验 tag 版本号与 manifest.json 版本号一致
      - name: 校验版本号一致性
        run: |
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          MANIFEST_VERSION="${{ steps.manifest.outputs.version }}"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::版本号不一致：tag=v$TAG_VERSION, manifest=$MANIFEST_VERSION"
            exit 1
          fi
          echo "版本号一致：$TAG_VERSION"

      # 5. 准备 CRX 签名私钥
      #    优先使用仓库 secret CRX_PRIVATE_KEY（固定密钥身份）；
      #    未配置时运行时生成临时密钥（本项目未上架 Web Store，无需固定身份）
      - name: 准备签名私钥
        run: |
          if [ -n "${{ secrets.CRX_PRIVATE_KEY }}" ]; then
            echo '${{ secrets.CRX_PRIVATE_KEY }}' > private.pem
            echo "使用 CRX_PRIVATE_KEY secret 中的固定密钥"
          else
            openssl genrsa -out private.pem 2048
            echo "运行时生成临时密钥（每次发布不同）"
          fi

      # 6. 用 crx3 打包扩展为 CRX，只包含扩展运行所需的文件
      - name: 打包扩展 CRX
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          npx crx3 -o "readpilot-v${VERSION}.crx" -p private.pem -- \
            manifest.json \
            background.js \
            content.js \
            content.css \
            lib/ \
            options.html \
            options.js \
            popup.html \
            popup.js \
            icons/

      # 清理私钥，确保不泄露
      - name: 清理私钥
        if: always()
        run: rm -f private.pem

      # 7. 从 CHANGELOG.md 提取当前版本的变更记录作为 release body
      - name: 提取 CHANGELOG 版本记录
        id: changelog
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          # 提取 [v{version}] 到下一个 [v...] 或文件末尾之间的内容
          # 兼容 [0.1.0] 和 [v0.1.0] 两种写法
          BODY=$(awk -v ver="v${VERSION}" -v ver2="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" || $0 ~ "^## \\[" ver2 "\\]" {
              found=1; next
            }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          # 写入多行输出文件，避免 GITHUB_OUTPUT 截断
          echo "$BODY" > /tmp/release_body.md
          echo "body_file=/tmp/release_body.md" >> "$GITHUB_OUTPUT"

      # 8. 创建 GitHub Release，附带 CRX 作为 asset
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          # 若 release body 为空，使用默认描述
          if [ ! -s /tmp/release_body.md ]; then
            echo "ReadPilot v${VERSION}" > /tmp/release_body.md
          fi
          gh release create "v${VERSION}" \
            --title "ReadPilot v${VERSION}" \
            --notes-file /tmp/release_body.md \
            "readpilot-v${VERSION}.crx"
